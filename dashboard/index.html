<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finite Boys, EPTC 2026: TIM-1 and TIM-2 selection from 144 Ansys runs and a Gaussian process surrogate." />
    <title>TIM Explorer · Finite Boys</title>
    <script>
      // Set the theme before first paint, so dark mode does not flash light
      try {
        var t = localStorage.getItem("tim-explorer-theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
